    <meta property="og:site_name" content="Everest Lockers" />
    <meta property="og:title" content="Everest Lockers" />
    <meta
      property="og:description"
      content="Agents store packages in the smallest fitting locker. Customers retrieve with a locker ID + pickup code. Storage bills in tiered 24-hour days."

    <meta property="og:url" content="https://everest-web-mi84.onrender.com/" />

      name="twitter:image"

    />
    <script>
      // UX-DR3: theme applies before first paint — no white flash. Dark is the
      // default; only an explicit stored "light" escapes it.
      (function () {
        try {
          if (localStorage.getItem('locker-theme') !== 'light') {
            document.documentElement.classList.add('dark');
          }
        } catch (error) {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
